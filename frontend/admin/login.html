<!DOCTYPE html>

<html>

<head>
  <title>Admin Login</title>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/theme.css">
</head>

<body class="admin-auth-bg">

  <div class="admin-login-wrapper">
    <div class="admin-login-card">

  <!-- ADMIN HEADER -->
  <div class="admin-header">
    <div class="admin-badge">ADMIN ACCESS</div>
    <h2>Administrator Login</h2>
    <p class="admin-subtext">Authorized personnel only</p>
  </div>

  <!-- USERNAME -->
  <label>Username</label>
  <div class="input-group admin-input">

    <span class="input-icon">
      <!-- USER ICON -->
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
      fill="none" stroke="currentColor" stroke-width="2"
      viewBox="0 0 24 24">
        <path d="M20 21a8 8 0 0 0-16 0"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </span>

    <input
      id="username"
      type="text"
      placeholder="Admin username"
      autocomplete="username"
    >

  </div>

  <!-- PASSWORD -->
  <label>Password</label>
  <div class="input-group admin-input">

    <span class="input-icon">
      <!-- LOCK ICON -->
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
      fill="none" stroke="currentColor" stroke-width="2"
      viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </span>

    <input
      id="password"
      type="password"
      placeholder="Admin password"
      autocomplete="current-password"
    >

    <!-- TOGGLE PASSWORD -->
    <span class="toggle-eye" onclick="toggleAdminPassword()">

      <svg id="eyeIcon"
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24">

        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
        <circle cx="12" cy="12" r="3"/>

      </svg>

    </span>

  </div>

  <!-- LOGIN BUTTON -->
  <button class="admin-primary-btn" onclick="adminLogin()">
    Login to Dashboard
  </button>

  <!-- SWITCH LOGIN -->
  <p class="auth-footer admin-footer">
    Not an admin?
    <a href="../auth/login.html">Go to User Login</a>
  </p>

  <pre id="result"></pre>

</div>

  </div>

  <script src="../js/config.js"></script>

  <script src="../js/admin.js"></script>

  <script>

    function toggleAdminPassword(){
      const password = document.getElementById("password")

      if(password.type === "password"){
        password.type = "text"
      } else {
        password.type = "password"
      }
    }

  </script>

</body>
</html>
